name: CI-Linux

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make libsdl2-dev libsdl2-ttf-dev

    - name: Build tests
      working-directory: ./viper_architecture/test
      run: |
        make clean
        make all

    - name: Run tests
      working-directory: ./viper_architecture/test
      run: |
        # Run all tests except pal_simulation if SDL2 not available
        ./test_viper_module
        ./test_integration_todo
        ./test_viper_view
        ./test_viper_interactor
        ./test_viper_entity
        ./test_viper_presenter
        # Run pal_simulation if SDL2 is available (should be)
        ./test_pal_simulation

    - name: Run CI script
      working-directory: ./viper_architecture/test
      run: |
        bash ci.sh
