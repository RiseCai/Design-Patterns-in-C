<!DOCTYPE html>
<html>
<head>
    <title>Acceptor FSM for Regular Expression</title>
    <script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>
    <script>
        const plantuml = `@startuml
title Acceptor FSM for Regular Expression "ab*"

skinparam state {
  BackgroundColor<<accepting>> LightGreen
  BorderColor<<accepting>> DarkGreen
  BackgroundColor<<reject>> LightPink
  BorderColor<<reject>> DarkRed
  BackgroundColor<<normal>> White
  BorderColor<<normal>> Black
  FontSize 13
}

state "q0 (initial)" as q0 <<normal>>
state "q1 (accepting)" as q1 <<accepting>>
state "reject" as reject <<reject>>

[*] --> q0

q0 --> q1 : 'a'
q0 --> reject : 'b'

q1 --> q1 : 'b'
q1 --> reject : 'a'

reject --> reject : any

note right of q0 : Start state
note right of q1 : Accepting state\nmatches "ab*"
note right of reject : Dead state (no acceptance)

@enduml`;

        function renderDiagram() {
            const encoded = plantumlEncoder.encode(plantuml);
            const img = document.getElementById('diagram');
            img.src = 'http://www.plantuml.com/plantuml/svg/' + encoded;
        }
        window.onload = renderDiagram;
    </script>
</head>
<body>
    <h1>Acceptor FSM for Regular Expression "ab*"</h1>
    <p>Acceptor‑type finite state machine for pattern matching.</p>
    <img id="diagram" alt="State Diagram" />
    <hr>
    <h2>PlantUML Source</h2>
    <pre style="background: #f0f0f0; padding: 10px; overflow: auto;">${plantuml}</pre>
</body>
</html>
